- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      paid:
        api: openai-completions
        baseURL: http://127.0.0.1:9/v1
        models: [{ id: m }]
        policy: { usageSource: api_metered }

- id: agent-default-model
  config:
    provider: paid
    model: m

- insert:
    - id: agent-intent-routing
      name: '@deepseek-ai/dsh-agent-default-model/intent-routing'
      config:
        routing:
          intent: chat
          routes:
            chat:
              selection: entry
            plan: { provider: unavailable-plan, model: unused }
            review: { provider: unavailable-review, model: unused }
            execute: { provider: unavailable-execute, model: unused }

- insert:
    - id: paid-route-policy
      name: '@deepseek-ai/dsh-paid-route-policy'
      config:
        grants:
          - provider: paid
            models: [m]
