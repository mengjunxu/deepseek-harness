# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      budget-fixture:
        api: openai-completions
        baseURL: http://127.0.0.1:9/v1
        models:
          - id: m
            input:
              - text
        policy:
          usageSource: local

- insert:
    - id: model-session-budget-exhausted-snapshot
      name: '../../../packages/guard/request-budget-policy/tests/fixtures/model-session-budget-exhausted.ts'

- id: storage-domain
  config:
    backend: json
    routes:
      request_budget: sqlite

- insert:
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('request-budgets.db')
    - id: request-budget-policy
      name: '@deepseek-ai/dsh-request-budget-policy'
      config:
        budgets:
          - id: reserved-fixture
            usageSource: local
            maxRequests: 3
            maxRequestsPerSession: 0
            routes:
              - provider: budget-fixture
                models: [m]
